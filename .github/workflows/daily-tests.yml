name: Automated Test Suite

on:
  push:
  pull_request:
  schedule:
    # GitHub Actions uses UTC. 07:00 UTC equals 08:00 CET (germantime)
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest #windows-latest works too

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Check frontend JavaScript syntax
        run: node --check Frontend/script.js

      - name: Run backend, export, regression, and frontend E2E tests
        run: pytest TESTS -v
