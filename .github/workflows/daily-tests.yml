name: Automated Test Suite

on:
  push:
  pull_request:
  schedule:
    # Runs daily at 08:17 Europe/Berlin. Avoids minute 0 because scheduled
    # workflows can be delayed or dropped during high-load periods.
    - cron: "17 8 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python backend and browser frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js for frontend syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Check frontend JavaScript syntax
        run: node --check Frontend/script.js

      - name: Run backend, export, and regression tests
        run: pytest TESTS -v -m "not e2e"

      - name: Run frontend browser E2E tests
        run: pytest TESTS/test_frontend_e2e.py -v
