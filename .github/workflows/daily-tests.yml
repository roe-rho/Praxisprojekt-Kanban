name: Automated Test Suite

on:
  push:
  pull_request:
  schedule:
    # GitHub Actions uses UTC. 07:00 UTC equals 08:00 CET standard time.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest #windows-latest works too

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js for frontend syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Check frontend JavaScript syntax
        run: node --check Frontend/script.js

      - name: Run backend, export, and regression tests
        run: pytest TESTS -v -m "not e2e"

      - name: Run frontend browser E2E tests
        run: pytest TESTS/test_frontend_e2e.py -v
